<!DOCTYPE html>
<html>
    <head>
        <link href="stylesheet" rel="1b.html">
        <meta charset="utf-8">
        <title>JavaScript</title>
        <script>
            function pozdrav(){
                alert("Bok!");
            }
        </script>
        <script>
           function pozdrav(ime, prezime) {
        alert("Bok!, " + ime + " " + prezime);
    }
</script>

    </head>
    <body>
        <h1>Zadatak 2</h1>
        <script>
           pozdrav();
        </script>
        <script>
            var posjetiteljIme = prompt("Upiši svoje ime: ", "");
            var posjetiteljPrezime = prompt("Upiši svoje prezime: ", "");
            pozdrav(posjetiteljIme, posjetiteljPrezime);
        </script>
    </body>
</html>
